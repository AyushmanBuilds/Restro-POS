<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .steam{animation:rise 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
    .s2{animation-delay:-2s}
    @keyframes rise{0%{opacity:0;transform:translateY(8px)}35%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
    @media (prefers-reduced-motion:reduce){.steam{animation:none}}
  </style>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16382D"/><stop offset="1" stop-color="#0D1E19"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A3A22"/><stop offset="1" stop-color="#2E1B0E"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98F55"/><stop offset="1" stop-color="#9A6637"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFC66B" stop-opacity=".55"/><stop offset="1" stop-color="#FFC66B" stop-opacity="0"/></radialGradient>
    <radialGradient id="cheese" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#FBD76B"/><stop offset="1" stop-color="#E9A93A"/></radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EDE4D3"/><stop offset=".45" stop-color="#FFFBF2"/><stop offset="1" stop-color="#E2D6BF"/></linearGradient>
    <linearGradient id="chai" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D79A52"/><stop offset="1" stop-color="#9C5A22"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="560" fill="url(#wall)"/>

  <!-- brick-like wall texture -->
  <g stroke="#ffffff" stroke-opacity=".035" stroke-width="2">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200"/>
    <path d="M60 0V80M180 80V160M60 160V240M180 240V320M60 320V400M300 0V80M420 80V160M300 160V240M420 240V320M300 320V400M540 0V80M660 80V160M540 160V240M660 240V320M780 0V80M900 80V160M780 160V240M900 240V320M1020 0V80M1140 80V160M1020 160V240M1140 240V320"/>
  </g>

  <!-- shelf with plants (left, calm) -->
  <rect x="40" y="250" width="260" height="10" rx="3" fill="#3A2514"/>
  <g>
    <path d="M90 250c-6-34 4-58 16-70-2 24 8 44 8 70z" fill="#2E8B57"/>
    <path d="M118 250c4-40 22-60 40-66-6 26-6 46-14 66z" fill="#3FA06A"/>
    <path d="M100 250c-20-24-28-44-26-62 18 12 28 34 34 62z" fill="#247548"/>
    <path d="M82 250h48l-6 30H88z" fill="#C4693D"/>
    <path d="M196 250h40l-4 24h-32z" fill="#EDE4D3"/>
    <path d="M216 250c-14-16-14-34-8-46 10 12 16 28 16 46z" fill="#3FA06A"/>
    <path d="M216 250c10-14 22-22 32-24-2 12-10 20-20 24z" fill="#2E8B57"/>
  </g>

  <!-- string lights -->
  <path d="M0 40 Q150 92 300 46 T600 40 T900 50 T1200 36" fill="none" stroke="#0A1612" stroke-width="2"/>
  <g fill="#FFD27A">
    <circle cx="60" cy="62" r="6"/><circle cx="150" cy="76" r="6"/><circle cx="240" cy="68" r="6"/><circle cx="330" cy="50" r="6"/>
    <circle cx="430" cy="48" r="6"/><circle cx="520" cy="56" r="6"/><circle cx="640" cy="46" r="6"/><circle cx="740" cy="52" r="6"/>
    <circle cx="840" cy="58" r="6"/><circle cx="950" cy="56" r="6"/><circle cx="1050" cy="48" r="6"/><circle cx="1140" cy="40" r="6"/>
  </g>
  <g fill="url(#glow)">
    <circle cx="150" cy="76" r="28"/><circle cx="430" cy="48" r="28"/><circle cx="740" cy="52" r="28"/><circle cx="1050" cy="48" r="28"/>
  </g>

  <!-- pendant lamps -->
  <g>
    <circle cx="880" cy="190" r="170" fill="url(#glow)"/>
    <path d="M880 0V96" stroke="#0A1612" stroke-width="3"/>
    <path d="M830 142Q830 98 880 96Q930 98 930 142z" fill="#C98F55"/>
    <ellipse cx="880" cy="143" rx="52" ry="7" fill="#FFE2A6"/>
    <circle cx="520" cy="130" r="110" fill="url(#glow)" opacity=".7"/>
    <path d="M520 0V66" stroke="#0A1612" stroke-width="3"/>
    <path d="M488 96Q488 68 520 66Q552 68 552 96z" fill="#C98F55"/>
    <ellipse cx="520" cy="97" rx="33" ry="5" fill="#FFE2A6"/>
  </g>

  <!-- table -->
  <rect y="430" width="1200" height="130" fill="url(#wood)"/>
  <rect y="430" width="1200" height="5" fill="#8A5A34" opacity=".8"/>
  <g stroke="#000" stroke-opacity=".12" stroke-width="2" fill="none">
    <path d="M0 470C300 462 600 480 1200 466"/><path d="M0 510C400 500 800 520 1200 506"/>
  </g>

  <!-- chai glass -->
  <g>
    <ellipse cx="610" cy="492" rx="62" ry="13" fill="#000" opacity=".28" filter="url(#soft)"/>
    <ellipse cx="610" cy="486" rx="56" ry="12" fill="#EDE4D3"/>
    <path d="M578 396h64l-6 86q-26 8-52 0z" fill="url(#chai)"/>
    <path d="M578 396h64l-1 14h-62z" fill="#F0D6A8" opacity=".85"/>
    <path d="M582 400l8 76" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="610" cy="396" rx="32" ry="6" fill="#F7E6C4"/>
    <path class="steam" d="M598 380c-10-14 8-24-2-40" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
    <path class="steam s2" d="M620 380c-10-14 8-24-2-40" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- pizza on board -->
  <g>
    <ellipse cx="830" cy="506" rx="190" ry="26" fill="#000" opacity=".3" filter="url(#soft)"/>
    <ellipse cx="830" cy="492" rx="182" ry="44" fill="url(#board)"/>
    <path d="M1012 492q40 0 44 10-6 6-44 4z" fill="#9A6637"/>
    <ellipse cx="830" cy="482" rx="150" ry="38" fill="#C88A3C"/>
    <ellipse cx="830" cy="479" rx="138" ry="34" fill="url(#cheese)"/>
    <g fill="#C4293D">
      <ellipse cx="760" cy="474" rx="17" ry="6"/><ellipse cx="830" cy="466" rx="17" ry="6"/><ellipse cx="900" cy="476" rx="17" ry="6"/>
      <ellipse cx="800" cy="492" rx="17" ry="6"/><ellipse cx="866" cy="490" rx="17" ry="6"/><ellipse cx="722" cy="486" rx="13" ry="5"/><ellipse cx="940" cy="484" rx="13" ry="5"/>
    </g>
    <g fill="#8E1B2B" opacity=".5">
      <ellipse cx="760" cy="476" rx="17" ry="3"/><ellipse cx="830" cy="468" rx="17" ry="3"/><ellipse cx="900" cy="478" rx="17" ry="3"/>
    </g>
    <g fill="#2E8B57">
      <path d="M780 470q12-14 24-4-8 12-24 4z"/><path d="M846 482q12-14 24-4-8 12-24 4z"/><path d="M880 462q12-14 24-4-8 12-24 4z"/><path d="M820 494q12-12 22-4-8 10-22 4z"/>
    </g>
    <g stroke="#B77A2E" stroke-width="2" opacity=".55"><path d="M830 442V516M692 479H968"/></g>
  </g>

  <!-- latte cup -->
  <g>
    <ellipse cx="1050" cy="494" rx="104" ry="18" fill="#000" opacity=".3" filter="url(#soft)"/>
    <ellipse cx="1050" cy="482" rx="94" ry="19" fill="#EDE4D3"/>
    <ellipse cx="1050" cy="479" rx="94" ry="17" fill="#FFFBF2"/>
    <path d="M1110 404q46-2 42 28-4 28-52 28" fill="none" stroke="url(#cup)" stroke-width="12" stroke-linecap="round"/>
    <path d="M980 392h140q0 80-70 88-70-8-70-88z" fill="url(#cup)"/>
    <ellipse cx="1050" cy="392" rx="70" ry="15" fill="#FFFBF2"/>
    <ellipse cx="1050" cy="393" rx="61" ry="12" fill="#8A5A3A"/>
    <path d="M1050 384c-18 2-30 7-30 10 0 6 14 10 30 11 16-1 30-5 30-11 0-3-12-8-30-10z" fill="#F0DFC0"/>
    <path d="M1050 388c-10 2-16 4-16 6 0 3 8 5 16 6 8-1 16-3 16-6 0-2-6-4-16-6z" fill="#8A5A3A"/>
    <path d="M1050 389v10" stroke="#F0DFC0" stroke-width="2.4" stroke-linecap="round"/>
    <path class="steam" d="M1030 368c-12-16 10-28-2-46" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="5" stroke-linecap="round"/>
    <path class="steam s2" d="M1058 366c-12-16 10-28-2-46" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- plant, far right -->
  <g>
    <path d="M1160 430h40v-10c0-10-6-18-14-18h-12c-8 0-14 8-14 18z" fill="#C4693D"/>
    <path d="M1180 404c-16-40-6-78 14-100 4 40 2 70-14 100z" fill="#2E8B57"/>
    <path d="M1180 404c-30-26-52-34-72-30 12 22 34 34 72 30z" fill="#3FA06A"/>
    <path d="M1180 404c-6-34-24-60-44-72 0 30 14 56 44 72z" fill="#247548"/>
  </g>
</svg>
